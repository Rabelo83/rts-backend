<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css?v=30" />
</head>
<body class="chat-standalone">
  <!-- Language Toggle Button -->
  <button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
    <span id="lang-label">EN / ES</span>
  </button>

  <header class="chat-alone-header">
    <div class="chat-alone-inner">
      <div>
        <h1>RTS Live Assistant</h1>
        <p>Get Gainesville RTS ETAs and schedules in one place.</p>
      </div>
      <a class="btn-link" href="/" aria-label="Back to main tracker">← Back to main tracker</a>
    </div>
  </header>

  <main class="chat-alone-main">
    <section class="chat-panel-disabled" aria-labelledby="chat-disabled-title">
      <div class="chat-disabled-header">
        <div>
          <h3 id="chat-disabled-title">RTS Chat (Development Phase)</h3>
          <p>This chat experience is in development phase and temporarily disabled.</p>
          <p class="chat-disabled-note">Use the RTS Trip Wizard at /wizard.</p>
        </div>
      </div>
      <div class="chat-disabled-body">
        <textarea disabled placeholder="Chat is in development phase. Use /wizard for now."></textarea>
        <button disabled type="button">Send</button>
      </div>
    </section>
  </main>
</body>
</html>
