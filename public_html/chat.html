<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css?v=33" />
  <style>
    /* ── Page shell ─────────────────────────────────────────── */
    body.chat-standalone {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-alone-header {
      flex-shrink: 0;
      padding: 16px 24px;
    }

    /* Header inner: centered, same max-width as panel */
    .chat-alone-inner {
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Main: full-width so align-items:center actually works ── */
    /* ROOT FIX: style.css sets max-width:640px on this — override it */
    .chat-alone-main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: none;      /* ← was 640px in style.css, caused left-alignment */
      margin: 0;
      padding: 20px 16px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Chat panel: centered card, fills available height ───── */
    #chat-panel.standalone {
      width: 100%;
      max-width: 780px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* override fixed-widget defaults from #chat-panel rule */
      position: relative;
      right: auto;
      bottom: auto;
      max-height: none;
      /* card appearance */
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      box-shadow:
        0 -2px 0 rgba(255, 255, 255, 0.06),
        0 -20px 60px rgba(0, 0, 0, 0.25),
        0 30px 80px rgba(0, 0, 0, 0.4);
    }

    /* ── Messages area ──────────────────────────────────────── */
    body.chat-standalone #chat-messages {
      flex: 1;
      min-height: 0;
      height: auto;
      padding: 20px 18px;
      overflow-y: auto;
      background: #f8fafc;
      gap: 10px;
    }

    /* ── End session row ────────────────────────────────────── */
    .chat-end-row {
      text-align: right;
      padding: 6px 14px 2px;
      background: #ffffff;
      flex-shrink: 0;
    }

    #chat-end {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color .15s ease, background .15s ease;
    }

    #chat-end:hover { color: #ef4444; background: #fff1f2; }

    /* ── Input row ──────────────────────────────────────────── */
    body.chat-standalone #chat-input-row {
      border-top: 1px solid #e5e7eb;
      padding: 10px 14px 18px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #ffffff;
      flex-shrink: 0;
    }

    body.chat-standalone #chat-input {
      height: 48px;
      min-height: 48px;
      max-height: 140px;
      resize: none;
      border-radius: 12px;
      font-size: 0.95rem;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      line-height: 1.4;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    body.chat-standalone #chat-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      background: #ffffff;
      outline: none;
    }

    /* ── Send button ────────────────────────────────────────── */
    body.chat-standalone #chat-send {
      width: 48px;
      min-width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 0;
      align-self: flex-end;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    body.chat-standalone #chat-send:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    body.chat-standalone #chat-send:active {
      transform: scale(0.96);
    }

    body.chat-standalone #chat-send svg {
      width: 20px;
      height: 20px;
      fill: white;
      pointer-events: none;
    }

    /* ── Language toggle (flows inside header) ──────────────── */
    body.chat-standalone .language-toggle {
      position: static;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      backdrop-filter: none;
      box-shadow: none;
      padding: 6px 14px;
      font-size: 0.82rem;
    }

    body.chat-standalone .language-toggle:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="chat-standalone">

  <header class="chat-alone-header">
    <div class="chat-alone-inner">
      <div>
        <h1>RTS Live Assistant</h1>
        <p>Get Gainesville RTS ETAs and schedules in one place.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
          <span id="lang-label">EN / ES</span>
        </button>
        <a class="btn-link" href="/" aria-label="Back to main tracker">← Back</a>
      </div>
    </div>
  </header>

  <main class="chat-alone-main">
    <div id="chat-panel" class="open standalone">
      <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
      <div id="starter-questions" class="starter-questions" role="group" aria-label="Quick questions"></div>
      <div class="chat-end-row">
        <button id="chat-end" type="button" title="End session">End session</button>
      </div>
      <div id="chat-input-row">
        <textarea
          id="chat-input"
          placeholder="Ask about routes, ETAs, or schedules…"
          aria-label="Your message"
          rows="2"
        ></textarea>
        <button id="chat-send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="/static/chat_v2.js?v=4" defer></script>
</body>
</html>
