<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css?v=31" />
  <style>
    /* Standalone-only overrides — viewport fill layout */
    body.chat-standalone {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-alone-header {
      flex-shrink: 0;
      padding: 14px 20px;
    }
    .chat-alone-main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 12px 20px 0;
    }
    #chat-panel.standalone {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      max-height: none;
    }
    body.chat-standalone #chat-messages {
      flex: 1;
      min-height: 0;
      height: auto;
    }
    body.chat-standalone #chat-input-row {
      align-items: flex-end;
      padding: 8px 10px 10px;
    }
    body.chat-standalone #chat-input {
      height: 48px;
      min-height: 48px;
      max-height: 140px;
      resize: none;
    }
    body.chat-standalone #chat-send {
      width: 48px;
      min-width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 0;
      align-self: flex-end;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
    }
    body.chat-standalone #chat-send svg {
      width: 20px;
      height: 20px;
      fill: white;
      pointer-events: none;
    }
    .chat-end-row {
      text-align: right;
      padding: 4px 10px 0;
    }
    #chat-end {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    #chat-end:hover { color: #ef4444; background: #fff1f2; }
  </style>
</head>
<body class="chat-standalone">

  <!-- Language Toggle -->
  <button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
    <span id="lang-label">EN / ES</span>
  </button>

  <header class="chat-alone-header">
    <div class="chat-alone-inner">
      <div>
        <h1>RTS Live Assistant</h1>
        <p>Get Gainesville RTS ETAs and schedules in one place.</p>
      </div>
      <a class="btn-link" href="/" aria-label="Back to main tracker">← Back</a>
    </div>
  </header>

  <main class="chat-alone-main">
    <div id="chat-panel" class="open standalone">
      <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
      <div id="starter-questions" class="starter-questions" role="group" aria-label="Quick questions"></div>
      <div class="chat-end-row">
        <button id="chat-end" type="button" title="End session">End session</button>
      </div>
      <div id="chat-input-row">
        <textarea
          id="chat-input"
          placeholder="Ask about routes, ETAs, or schedules…"
          aria-label="Your message"
          rows="2"
        ></textarea>
        <button id="chat-send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="/static/chat_v2.js?v=2" defer></script>
</body>
</html>
