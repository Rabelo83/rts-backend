<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA: manifest + shared chrome styles (travel together) -->
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/pwa.css">

  <!-- iOS PWA meta -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- TODO: render apple-mobile-web-app-title from agency_config via Jinja2 -->
  <meta name="apple-mobile-web-app-title" content="RTS Bus">
  <meta name="theme-color" content="#0057B8">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:            #070d1a;
      --surface:       rgba(15, 23, 42, 0.80);
      --surface-solid: #0f172a;
      --border:        rgba(255,255,255,0.08);
      --border-focus:  rgba(59,130,246,0.6);
      --user-bg:       linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --bot-bg:        rgba(255,255,255,0.06);
      --bot-border:    rgba(255,255,255,0.10);
      --accent:        #3b82f6;
      --accent-glow:   rgba(59,130,246,0.35);
      --text:          #f1f5f9;
      --text-muted:    #64748b;
      --text-dim:      #94a3b8;
      --radius-msg:    18px;
      --radius-card:   28px;
      --input-h:       52px;
    }

    /* ── Base ───────────────────────────────────────────────── */
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Animated background orbs ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 20%, rgba(37,99,235,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 80% 80%, rgba(99,102,241,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(15,23,42,0.9) 0%, transparent 100%);
      animation: orb-drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes orb-drift {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      50%  { opacity: 0.85; transform: scale(1.04) translateY(-12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Subtle grid overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .chat-header {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      padding: 14px 20px;
      background: rgba(7,13,26,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .chat-header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .chat-brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(59,130,246,0.3), 0 4px 12px rgba(37,99,235,0.4);
      flex-shrink: 0;
    }

    .chat-brand-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .chat-brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .chat-brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 400;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.25);
      color: #34d399;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #34d399;
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-lang {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      font-family: inherit;
      letter-spacing: 0.03em;
    }

    .btn-lang:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s, color .15s;
      font-family: inherit;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
      color: var(--text);
    }

    /* ── Main layout ─────────────────────────────────────────── */
    .chat-main {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* ── Chat panel card ─────────────────────────────────────── */
    #chat-panel {
      width: 100%;
      max-width: 800px;
      height: min(720px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.05),
        0 8px 32px rgba(0,0,0,0.4),
        0 32px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
    }

    /* Subtle top glow line */
    #chat-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
      z-index: 1;
    }

    /* ── Messages area ──────────────────────────────────────── */
    #chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    #chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.18);
    }

    /* ── Message row (wraps bubble + optional avatar + timestamp) ─ */
    .msg-row {
      display: flex;
      animation: msg-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .msg-row.user {
      flex-direction: column;
      align-self: flex-end;
      align-items: flex-end;
      max-width: min(78%, 600px);
    }
    .msg-row.bot {
      flex-direction: row;
      align-self: flex-start;
      align-items: flex-end;
      gap: 8px;
      max-width: min(86%, 640px);
    }
    .msg-row.grouped { margin-top: -10px; }

    .msg-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37,99,235,0.28);
      align-self: flex-end;
      margin-bottom: 16px;
    }
    .msg-avatar svg { width: 15px; height: 15px; fill: white; }
    .msg-row.grouped .msg-avatar { visibility: hidden; }

    .msg-time {
      font-size: 0.68rem;
      color: rgba(148,163,184,0.45);
      margin-top: 3px;
      letter-spacing: 0.02em;
      padding: 0 4px;
      user-select: none;
    }
    .msg-row.grouped .msg-time { display: none; }

    /* ── Message bubbles ─────────────────────────────────────── */
    /* JS creates: div.bubble.user | div.bubble.bot | div.bubble.bot.loading */
    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius-msg);
      font-size: 0.90rem;
      line-height: 1.6;
      word-break: break-word;
      margin-bottom: 0;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* User bubble — right-aligned blue gradient */
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
    }

    /* Bot bubble — left-aligned glass dark */
    .bubble.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      color: #e2e8f0;
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* Action button container bubble */
    .bubble.bot.bubble-actions {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0 0 4px;
    }

    /* Bold/links/code inside bot bubbles */
    .bubble.bot strong { color: #fff; font-weight: 600; }
    .bubble.bot a { color: #93c5fd; }
    .bubble.bot code {
      background: rgba(255,255,255,0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.85em;
    }

    /* ── Rating buttons ──────────────────────────────────────── */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .rating-label {
      font-size: 0.72rem;
      opacity: 0.45;
      letter-spacing: 0.02em;
      user-select: none;
    }
    .rating-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      opacity: 0.35;
      padding: 2px 5px;
      border-radius: 4px;
      transition: opacity 0.15s, background 0.15s;
      line-height: 1;
    }
    .rating-btn:hover { opacity: 0.75; }
    .rating-btn.selected {
      opacity: 1;
      background: rgba(255,255,255,0.12);
    }

    /* ── Typing indicator ────────────────────────────────────── */
    .bubble.loading {
      padding: 12px 16px;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); background: rgba(255,255,255,0.25); }
      30%            { transform: translateY(-6px); background: rgba(99,165,250,0.8); }
    }

    /* ── Starter questions ───────────────────────────────────── */
    .starter-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-self: flex-start;
      max-width: min(86%, 640px);
      margin-left: 36px; /* align with bot bubble content, past the avatar */
      padding: 4px 0 2px;
    }

    .starter-q {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .1s;
      white-space: nowrap;
    }

    .starter-q:hover {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.35);
      color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
      transform: translateY(-1px);
    }

    /* ── Button strip: quick reply buttons from tool results ─── */
    .chat-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chat-btn {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }

    .chat-btn:hover {
      background: rgba(59,130,246,0.22);
      border-color: rgba(59,130,246,0.5);
      color: #bfdbfe;
      transform: translateY(-1px);
    }

    /* ── End session row ─────────────────────────────────────── */
    .chat-end-row {
      padding: 4px 16px 2px;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    #chat-end {
      background: none;
      border: none;
      color: #475569;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    #chat-end:hover { color: #ef4444; background: rgba(239,68,68,0.08); }

    /* ── Input row ──────────────────────────────────────────── */
    #chat-input-row {
      position: relative;
      padding: 10px 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      background: rgba(7,13,26,0.5);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    #chat-input {
      width: 100%;
      min-height: var(--input-h);
      max-height: 140px;
      resize: none;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.45;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      caret-color: var(--accent);
    }

    #chat-input::placeholder { color: #475569; }

    #chat-input:focus {
      background: rgba(255,255,255,0.07);
      border-color: var(--border-focus);
      box-shadow:
        0 0 0 3px rgba(59,130,246,0.12),
        0 0 20px rgba(59,130,246,0.08);
    }

    /* ── Send button ─────────────────────────────────────────── */
    #chat-send {
      width: var(--input-h);
      height: var(--input-h);
      min-width: var(--input-h);
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.3),
        0 4px 16px rgba(37,99,235,0.45);
      transition: transform .15s cubic-bezier(0.34,1.56,0.64,1), box-shadow .15s;
    }

    #chat-send:hover {
      transform: scale(1.07) translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.4),
        0 8px 24px rgba(37,99,235,0.55);
    }

    #chat-send:active { transform: scale(0.95); }

    #chat-send svg {
      width: 20px;
      height: 20px;
      fill: white;
      pointer-events: none;
      transform: translateX(1px);
    }

    #chat-send.loading {
      pointer-events: none;
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
    }

    #chat-send.loading svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) translateX(0); } }

    /* Send button content morphs with input state */
    #chat-send .icon-send { display: inline-flex; }
    #chat-send .icon-mic  { display: none; }
    #chat-send.empty { background: linear-gradient(135deg, #334155 0%, #1e293b 100%); box-shadow: 0 0 0 1px rgba(148,163,184,0.15), 0 2px 8px rgba(0,0,0,0.25); }
    #chat-send.empty .icon-send { display: none; }
    #chat-send.empty .icon-mic  { display: inline-flex; }
    #chat-send.empty svg { transform: none; }

    /* Voice hint toast (shown when user taps mic before typing) */
    #voice-hint {
      position: absolute;
      right: 16px;
      bottom: calc(var(--input-h) + 32px);
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148,163,184,0.2);
      color: #e2e8f0;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s, transform .18s;
      z-index: 20;
      max-width: 240px;
    }
    #voice-hint.show { opacity: 1; transform: translateY(0); }

    /* ── Panel tabs ──────────────────────────────────────────── */
    .panel-tabs {
      display: flex;
      gap: 2px;
      padding: 10px 14px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text-dim); }

    .tab-btn.active {
      color: #60a5fa;
      border-bottom-color: #3b82f6;
    }

    /* ── Trip planner panel ───────────────────────────────────── */
    #trip-panel {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #trip-panel::-webkit-scrollbar { width: 4px; }
    #trip-panel::-webkit-scrollbar-track { background: transparent; }
    #trip-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .hidden { display: none !important; }

    /* ── Reduced service banner ──────────────────────────────── */
    .trip-service-banner {
      padding: 9px 13px;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 10px;
      color: #fbbf24;
      font-size: 0.80rem;
    }

    /* ── Time mode toggle ─────────────────────────────────────── */
    .time-mode-row {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 3px;
    }

    .time-mode-btn {
      flex: 1;
      background: none;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 4px;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }

    .time-mode-btn.active {
      background: rgba(59,130,246,0.18);
      color: #60a5fa;
      font-weight: 600;
    }

    .trip-datetime-row { display: flex; gap: 8px; }
    .trip-date-input { flex: 1.4; padding: 10px 14px; color-scheme: dark; }
    .trip-time-input { flex: 1;   padding: 10px 14px; color-scheme: dark; }

    /* ── Itinerary time column ────────────────────────────────── */
    .itin-time-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .itin-total { font-size: 0.90rem; font-weight: 700; color: #f8fafc; white-space: nowrap; }
    .itin-dep-arr { font-size: 0.70rem; color: var(--text-muted); white-space: nowrap; }
    .itin-timerange {
      font-size: 0.69rem;
      color: var(--text-muted);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .itin-tr-sep { opacity: 0.45; font-size: 0.65rem; }

    /* ── ETA badge ────────────────────────────────────────────── */
    .eta-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .rt-dot-inline {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #34d399;
      animation: live-pulse 2s ease-in-out infinite;
    }

    /* legacy stubs — no longer used but kept to avoid stale ref errors */
    .leg-walk-time { display: none; }
    .leg-ride-min  { display: none; }
    .leg-side-note { display: none; }

    /* ── Trip form ────────────────────────────────────────────── */
    .trip-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trip-field {
      position: relative;
    }

    .trip-swap-row {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0;
    }

    .trip-swap-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 10px;
      transition: background .15s, color .15s;
    }

    .trip-swap-btn:hover {
      background: rgba(255,255,255,0.12);
      color: var(--text);
    }

    .trip-field label {
      display: block;
      font-size: 0.70rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .trip-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.90rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s, background .2s;
    }

    .trip-input::placeholder { color: #475569; }

    .trip-input:focus {
      background: rgba(255,255,255,0.07);
      border-color: var(--border-focus);
    }

    .ac-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .ac-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--text-dim);
      cursor: pointer;
      transition: background .1s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: rgba(59,130,246,0.1); color: #93c5fd; }

    .trip-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: 0.01em;
    }

    .trip-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .trip-submit:active { transform: scale(0.98); }
    .trip-submit:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* ── Itinerary cards ──────────────────────────────────────── */
    .trip-error {
      padding: 12px 14px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
    }

    #trip-results {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .trip-results-label {
      font-size: 0.70rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .itin-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: msg-in 0.25s ease both;
    }

    .itin-card:hover { border-color: rgba(59,130,246,0.25); }

    /* Collapsible legs */
    .itin-legs { display: none; }
    .itin-open .itin-legs { display: flex; flex-direction: column; }

    /* Header is now a button */
    .itin-header {
      width: 100%;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .itin-header:focus-visible { outline: 2px solid rgba(59,130,246,0.5); border-radius: 8px; }

    /* Chevron rotates when open */
    .itin-chevron {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
      align-self: center;
      margin-left: 4px;
      line-height: 1;
    }
    .itin-open .itin-chevron { transform: rotate(90deg); }

    .itin-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .itin-header-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    /* Journey strip: 🚶 › [75] › ⇄ › [1] › 🚶 */
    .journey-strip {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
    }

    .js-walk {
      display: inline-flex;
      align-items: center;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .js-route {
      font-size: 0.76rem;
      font-weight: 800;
      color: #fff;
      background: #2563eb;
      border-radius: 5px;
      padding: 2px 8px;
      min-width: 20px;
      text-align: center;
      letter-spacing: 0;
      line-height: 1.3;
    }

    .js-xfer {
      display: inline-flex;
      align-items: center;
      color: #f59e0b;
      opacity: 0.8;
    }

    .js-arrow {
      color: var(--text-muted);
      font-size: 0.80rem;
      opacity: 0.5;
      line-height: 1;
    }

    .itin-meta-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .itin-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-route {
      background: #2563eb;
      border: none;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 7px;
      min-width: 26px;
      text-align: center;
      letter-spacing: 0;
    }

    .badge-realtime {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
    }

    .badge-transfer {
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.3);
      color: #fbbf24;
    }

    .badge-same-side {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
    }

    .itin-time {
      font-size: 0.80rem;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
    }

    .itin-time span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.72rem;
    }

    /* ── Timeline stepper ─────────────────────────────────────── */
    .tp-timeline { display: flex; flex-direction: column; }

    .tp-row {
      display: grid;
      grid-template-columns: 50px 18px 1fr;
      gap: 0 8px;
    }

    /* Time column */
    .tp-col-time {
      text-align: right;
      font-size: 0.70rem;
      font-weight: 700;
      color: #e2e8f0;
      padding-top: 5px;
      white-space: nowrap;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    /* Track column */
    .tp-col-track {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tp-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
      z-index: 1;
    }
    .tp-dot-origin { background: #475569; }
    .tp-dot-board  { background: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); width:13px; height:13px; margin-top:4px; }
    .tp-dot-exit   { background: #f59e0b; width:11px; height:11px; margin-top:4px; }
    .tp-dot-arrive { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); width:13px; height:13px; margin-top:4px; }
    .tp-dot-dest   { background: #10b981; width:10px; height:10px; margin-top:5px; }

    .tp-line {
      width: 2px;
      flex: 1;
      min-height: 8px;
      margin: 2px 0;
    }
    .tp-line-walk { background: rgba(148,163,184,0.22); }
    .tp-line-bus  { background: rgba(59,130,246,0.35); }
    .tp-line-xfer { background: repeating-linear-gradient(
      to bottom,
      rgba(245,158,11,0.35) 0, rgba(245,158,11,0.35) 4px,
      transparent 4px, transparent 7px
    ); }

    /* Content column */
    .tp-col-body {
      padding-top: 3px;
      padding-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 0.77rem;
      color: var(--text-dim);
      line-height: 1.4;
      min-width: 0;
    }

    /* Board row */
    .tp-row-board .tp-col-body { padding-bottom: 3px; }

    .tp-action-board {
      font-size: 0.60rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #93c5fd;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.28);
      border-radius: 4px;
      padding: 1px 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tp-route-num {
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      background: #2563eb;
      border-radius: 6px;
      padding: 1px 9px;
      min-width: 22px;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .tp-headsign {
      font-size: 0.75rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .tp-rt-pulse {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #34d399;
      flex-shrink: 0;
      animation: live-pulse 2s ease-in-out infinite;
    }

    /* Ride row */
    .tp-row-ride .tp-col-body {
      font-size: 0.70rem;
      color: var(--text-muted);
      padding-bottom: 3px;
      gap: 4px;
    }

    /* Exit / Arrive rows */
    .tp-action-exit {
      font-size: 0.60rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fcd34d;
      background: rgba(245,158,11,0.10);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 4px;
      padding: 1px 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tp-action-arrive {
      font-size: 0.60rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6ee7b7;
      background: rgba(16,185,129,0.10);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 4px;
      padding: 1px 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tp-stop-name {
      font-size: 0.79rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    /* Transfer row */
    .tp-row-xfer .tp-col-body {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 5px 9px;
      background: rgba(245,158,11,0.06);
      border: 1px solid rgba(245,158,11,0.14);
      border-radius: 8px;
      margin-bottom: 2px;
    }

    .tp-xfer-wait  { font-size: 0.72rem; font-weight: 600; color: #fbbf24; }
    .tp-xfer-side  { font-size: 0.70rem; }
    .tp-same-side  { color: #a5b4fc; }
    .tp-cross-street { color: #fca5a5; }
    .tp-shelter    { font-size: 0.68rem; color: var(--text-muted); margin-left: 4px; }

    /* Walk rows */
    .tp-row-walk .tp-col-body { font-size: 0.74rem; color: var(--text-muted); gap: 4px; }
    .tp-row-walk .tp-col-body strong { color: var(--text-dim); font-weight: 600; }
    .tp-dur { font-size: 0.69rem; color: var(--text-muted); }

    /* Last row in timeline — trim excess bottom padding */
    .tp-timeline .tp-row:last-child .tp-col-body { padding-bottom: 4px; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .chat-main {
        padding: 0;
        align-items: stretch;
      }
      #chat-panel {
        width: 100%;
        max-width: none;
        height: 100%;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      #chat-panel::before { display: none; }
      .chat-brand-text h1 { font-size: 1.05rem; }
      .chat-brand-text p { display: none; }
      .live-badge { display: none; }
      #chat-messages { padding: 16px 14px 10px; }
      .bubble { font-size: 1rem; padding: 12px 14px; max-width: 88%; line-height: 1.55; }
      .rating-label { font-size: 0.8rem; }
      .rating-btn { font-size: 1rem; padding: 6px 10px; }
      .starter-q { font-size: 0.9rem; padding: 9px 14px; }
      #chat-input-row { padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px); }
      #trip-panel { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="chat-header">
    <div class="chat-header-inner">
      <div class="chat-brand">
        <div class="chat-brand-icon">
          <!-- Bus icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4S4 2.5 4 6v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
          </svg>
        </div>
        <div class="chat-brand-text">
          <h1>RTS Live Assistant
            <span class="live-badge"><span class="live-dot"></span>Live</span>
          </h1>
          <p>Gainesville Regional Transit System</p>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="btn-lang language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
          <span id="lang-label">EN / ES</span>
        </button>
        <a class="btn-back" href="/" aria-label="Back to main tracker">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          Back
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="chat-main">
    <div id="chat-panel" class="open standalone">

      <!-- Panel tabs -->
      <div class="panel-tabs" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true"  data-tab="chat" onclick="switchTab('chat')">&#x1F4AC; Chat</button>
        <button class="tab-btn"        role="tab" aria-selected="false" data-tab="trip" onclick="switchTab('trip')">&#x1F68C; Plan a Trip</button>
      </div>

      <!-- Chat tab content -->
      <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>

      <div id="chat-end-row" class="chat-end-row" hidden>
        <button id="chat-end" type="button">End session</button>
      </div>

      <div id="chat-input-row">
        <div class="input-wrap">
          <textarea
            id="chat-input"
            placeholder="Ask anything about your bus…"
            aria-label="Your message"
            rows="1"
          ></textarea>
        </div>
        <button id="chat-send" type="button" class="empty" aria-label="Send message">
          <span class="icon-send" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </span>
          <span class="icon-mic" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
          </span>
        </button>
        <div id="voice-hint" role="status" aria-live="polite"></div>
      </div>

      <!-- Trip planner tab content -->
      <div id="trip-panel" class="hidden" role="tabpanel" aria-label="Trip planner"></div>

    </div>
  </main>

  <script src="/static/chat_v2.js?v=8" defer></script>
  <script src="/static/trip_planner.js?v=3" defer></script>

  <!-- PWA chrome (offline banner, install button, iOS tip) -->
  <div id="offline-banner" hidden>You're offline. Showing last known information.</div>
  <button id="btn-install" class="btn-install" hidden>Install app</button>
  <div id="ios-tip" hidden>
    <p>Tap <strong>Share → Add to Home Screen</strong> to install.</p>
    <button id="ios-tip-close" aria-label="Dismiss tip">✕</button>
  </div>
  <!-- PWA SW registered by frontend.js; chat_v2.js has its own init -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(r => console.log('[PWA] SW scope:', r.scope))
          .catch(e => console.warn('[PWA] SW failed:', e))
      );
    }
    // Offline banner
    const _ob = document.getElementById('offline-banner');
    function _syncOnline() { if (_ob) _ob.hidden = navigator.onLine; }
    window.addEventListener('online', _syncOnline);
    window.addEventListener('offline', _syncOnline);
    _syncOnline();
  </script>
</body>
</html>
