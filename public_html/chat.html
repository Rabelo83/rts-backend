<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css?v=30" />
  <style>
    #chat-messages {
      height: 55vh;
      min-height: 280px;
    }
    .chat-end-row {
      text-align: right;
      padding: 6px 10px 0;
    }
    #chat-end {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    #chat-end:hover { color: #ef4444; background: #fff1f2; }
  </style>
</head>
<body class="chat-standalone">

  <!-- Language Toggle -->
  <button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
    <span id="lang-label">EN / ES</span>
  </button>

  <header class="chat-alone-header">
    <div class="chat-alone-inner">
      <div>
        <h1>RTS Live Assistant</h1>
        <p>Get Gainesville RTS ETAs and schedules in one place.</p>
      </div>
      <a class="btn-link" href="/" aria-label="Back to main tracker">← Back to main tracker</a>
    </div>
  </header>

  <main class="chat-alone-main">
    <div id="chat-panel" class="open standalone">
      <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
      <div class="chat-end-row">
        <button id="chat-end" type="button" title="End session">End session</button>
      </div>
      <div id="chat-input-row">
        <textarea
          id="chat-input"
          placeholder="Ask about routes, ETAs, or schedules…"
          aria-label="Your message"
          rows="2"
        ></textarea>
        <button id="chat-send" type="button">Send</button>
      </div>
    </div>
  </main>

  <script src="/static/chat_v2.js?v=1" defer></script>
</body>
</html>
