<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:            #070d1a;
      --surface:       rgba(15, 23, 42, 0.80);
      --surface-solid: #0f172a;
      --border:        rgba(255,255,255,0.08);
      --border-focus:  rgba(59,130,246,0.6);
      --user-bg:       linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --bot-bg:        rgba(255,255,255,0.06);
      --bot-border:    rgba(255,255,255,0.10);
      --accent:        #3b82f6;
      --accent-glow:   rgba(59,130,246,0.35);
      --text:          #f1f5f9;
      --text-muted:    #64748b;
      --text-dim:      #94a3b8;
      --radius-msg:    18px;
      --radius-card:   28px;
      --input-h:       52px;
    }

    /* ── Base ───────────────────────────────────────────────── */
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Animated background orbs ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 20%, rgba(37,99,235,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 80% 80%, rgba(99,102,241,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(15,23,42,0.9) 0%, transparent 100%);
      animation: orb-drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes orb-drift {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      50%  { opacity: 0.85; transform: scale(1.04) translateY(-12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Subtle grid overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .chat-header {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      padding: 14px 20px;
      background: rgba(7,13,26,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .chat-header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .chat-brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(59,130,246,0.3), 0 4px 12px rgba(37,99,235,0.4);
      flex-shrink: 0;
    }

    .chat-brand-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .chat-brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .chat-brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 400;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.25);
      color: #34d399;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #34d399;
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-lang {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      font-family: inherit;
      letter-spacing: 0.03em;
    }

    .btn-lang:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s, color .15s;
      font-family: inherit;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
      color: var(--text);
    }

    /* ── Main layout ─────────────────────────────────────────── */
    .chat-main {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* ── Chat panel card ─────────────────────────────────────── */
    #chat-panel {
      width: 100%;
      max-width: 800px;
      height: min(720px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.05),
        0 8px 32px rgba(0,0,0,0.4),
        0 32px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
    }

    /* Subtle top glow line */
    #chat-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
      z-index: 1;
    }

    /* ── Messages area ──────────────────────────────────────── */
    #chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    #chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.18);
    }

    /* ── Message bubbles ─────────────────────────────────────── */
    /* JS creates: div.bubble.user | div.bubble.bot | div.bubble.bot.loading */
    .bubble {
      max-width: min(76%, 600px);
      padding: 11px 15px;
      border-radius: var(--radius-msg);
      font-size: 0.90rem;
      line-height: 1.6;
      word-break: break-word;
      animation: msg-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      margin-bottom: 2px;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* User bubble — right-aligned blue gradient */
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
    }

    /* Bot bubble — left-aligned glass dark */
    .bubble.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      color: #e2e8f0;
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* Action button container bubble */
    .bubble.bot.bubble-actions {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0 0 4px;
    }

    /* Bold/links/code inside bot bubbles */
    .bubble.bot strong { color: #fff; font-weight: 600; }
    .bubble.bot a { color: #93c5fd; }
    .bubble.bot code {
      background: rgba(255,255,255,0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.85em;
    }

    /* ── Typing indicator ────────────────────────────────────── */
    .bubble.loading {
      padding: 12px 16px;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); background: rgba(255,255,255,0.25); }
      30%            { transform: translateY(-6px); background: rgba(99,165,250,0.8); }
    }

    /* ── Starter questions ───────────────────────────────────── */
    .starter-questions {
      padding: 0 16px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
    }

    .starter-q {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .1s;
      white-space: nowrap;
    }

    .starter-q:hover {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.35);
      color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
      transform: translateY(-1px);
    }

    /* ── Button strip: quick reply buttons from tool results ─── */
    .chat-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chat-btn {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }

    .chat-btn:hover {
      background: rgba(59,130,246,0.22);
      border-color: rgba(59,130,246,0.5);
      color: #bfdbfe;
      transform: translateY(-1px);
    }

    /* ── End session row ─────────────────────────────────────── */
    .chat-end-row {
      padding: 4px 16px 2px;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    #chat-end {
      background: none;
      border: none;
      color: #475569;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    #chat-end:hover { color: #ef4444; background: rgba(239,68,68,0.08); }

    /* ── Input row ──────────────────────────────────────────── */
    #chat-input-row {
      padding: 10px 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      background: rgba(7,13,26,0.5);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    #chat-input {
      width: 100%;
      min-height: var(--input-h);
      max-height: 140px;
      resize: none;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.45;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      caret-color: var(--accent);
    }

    #chat-input::placeholder { color: #475569; }

    #chat-input:focus {
      background: rgba(255,255,255,0.07);
      border-color: var(--border-focus);
      box-shadow:
        0 0 0 3px rgba(59,130,246,0.12),
        0 0 20px rgba(59,130,246,0.08);
    }

    /* ── Send button ─────────────────────────────────────────── */
    #chat-send {
      width: var(--input-h);
      height: var(--input-h);
      min-width: var(--input-h);
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.3),
        0 4px 16px rgba(37,99,235,0.45);
      transition: transform .15s cubic-bezier(0.34,1.56,0.64,1), box-shadow .15s;
    }

    #chat-send:hover {
      transform: scale(1.07) translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.4),
        0 8px 24px rgba(37,99,235,0.55);
    }

    #chat-send:active { transform: scale(0.95); }

    #chat-send svg {
      width: 20px;
      height: 20px;
      fill: white;
      pointer-events: none;
      transform: translateX(1px);
    }

    #chat-send.loading {
      pointer-events: none;
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
    }

    #chat-send.loading svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) translateX(0); } }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .chat-main { padding: 10px 8px; }
      #chat-panel { border-radius: 20px; height: min(680px, 100%); }
      .chat-brand-text p { display: none; }
      .live-badge { display: none; }
      #chat-messages { padding: 16px 12px 10px; }
      .bubble { font-size: 0.88rem; padding: 10px 13px; max-width: 88%; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="chat-header">
    <div class="chat-header-inner">
      <div class="chat-brand">
        <div class="chat-brand-icon">
          <!-- Bus icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4S4 2.5 4 6v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
          </svg>
        </div>
        <div class="chat-brand-text">
          <h1>RTS Live Assistant
            <span class="live-badge"><span class="live-dot"></span>Live</span>
          </h1>
          <p>Gainesville Regional Transit System</p>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="btn-lang language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
          <span id="lang-label">EN / ES</span>
        </button>
        <a class="btn-back" href="/" aria-label="Back to main tracker">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          Back
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="chat-main">
    <div id="chat-panel" class="open standalone">

      <div id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>

      <div id="starter-questions" class="starter-questions" role="group" aria-label="Quick questions"></div>

      <div class="chat-end-row">
        <button id="chat-end" type="button">End session</button>
      </div>

      <div id="chat-input-row">
        <div class="input-wrap">
          <textarea
            id="chat-input"
            placeholder="Ask about routes, ETAs, or schedules…"
            aria-label="Your message"
            rows="1"
          ></textarea>
        </div>
        <button id="chat-send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

    </div>
  </main>

  <script src="/static/chat_v2.js?v=6" defer></script>
</body>
</html>
