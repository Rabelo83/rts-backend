<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTS Live Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css?v=30" />
</head>
<body class="chat-standalone">
  <!-- Language Toggle Button -->
  <button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
    <span id="lang-label">EN / ES</span>
  </button>

  <header class="chat-alone-header">
    <div class="chat-alone-inner">
      <div>
        <h1>RTS Live Assistant</h1>
        <p>Get Gainesville RTS ETAs and schedules in one place.</p>
      </div>
      <a class="btn-link" href="/" aria-label="Back to main tracker">← Back to main tracker</a>
    </div>
  </header>

  <main class="chat-alone-main">
    <div id="chat-panel" class="open standalone">
      <div id="chat-header">
        <div>
          <span>RTS Assistant</span>
          <small>Sessions close after 5 min of inactivity.</small>
        </div>
        <div class="chat-actions">
          <button id="chat-end" type="button" aria-label="End chat">End</button>
        </div>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <textarea id="chat-input" placeholder="Type your message..."></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </main>

  <!-- Use V2 chat with all improvements -->
  <script src="/static/chat_v2.js?v=30"></script>
</body>
</html>
