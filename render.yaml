services:
  - type: web
    name: rts-backend
    env: python
    plan: free
    # Build installs deps AND builds the GTFS SQLite schedule DB
    buildCommand: pip install -r requirements.txt && GTFS_DB_PATH="Backend Basics/db/rts_gtfs.sqlite" python scripts/gtfs_ingest.py
    startCommand: gunicorn server:app
    envVars:
      - key: BUS_API_KEY
        # set the value in the Render dashboard later, do not hardcode here
        value: REPLACE_ME
      - key: RTPIDATAFEED
        value: bustime
      - key: GTFS_URL
        # Paste the direct GTFS .zip link here (or set it in Render dashboard)
        value: REPLACE_ME
