agency:
  id: "rts-gainesville"                    # slug used in multi-tenant routing
  short_name: "RTS"
  full_name: "Gainesville RTS (Regional Transit System)"
  city: "Gainesville"
  state: "FL"
  timezone: "America/New_York"

contact:
  support_phone: "(352) 334-2600"
  support_hours: "8 AM–4 PM, 7 days a week"
  support_hours_es: "8 AM–4 PM, 7 días a la semana"
  email: "alfredo.rabelo@am2ar.com"
  website: "https://go-rts.com"
  rider_app_url: "https://riderts.app"

realtime:
  provider: "bustime"                      # one of: bustime | gtfs_rt | swiftly | transloc
  endpoint: "https://riderts.app/bustime/api/v3"
  api_key_env: "BUS_API_KEY"
  rtpidatafeed: "bustime"

gtfs:
  static_feed_path: "Backend Basics/RTSGTFS_Summer2026_V1"
  db_path: "Backend Basics/db/rts_gtfs.sqlite"
  refresh_mode: "on_deploy"               # later: scheduled

geocoding:
  # Bounding box [W, S, E, N] used to bias geocoding queries to the service area
  bbox: [-82.55, 29.55, -82.10, 29.85]
  city_hint: "Gainesville FL"

map:
  # Default Live Map viewport when the user opens the Map tab.
  # White-label rule: map.js must NOT hardcode coordinates — every value lives
  # here. New agencies override this block with their own center/zoom.
  default_view:
    center: [-82.345, 29.65]   # [lon, lat]
    zoom: 11.7

languages:
  default: "en"
  supported: ["en", "es"]

landmarks:
  hubs:
    - { stop_id: 1,    id: "rosa-parks-ts",    display: "Rosa Parks RTS Downtown Station" }
    - { stop_id: 1493, id: "butler-plaza-ts",  display: "Butler Plaza Transfer Station" }
    - { stop_id: 1097, id: "oaks-mall",        display: "Oaks Mall" }
    - { stop_id: 473,  id: "reitz-union",      display: "Reitz Union" }
    - { stop_id: 13,   id: "beaty-towers",     display: "Beaty Towers" }
  # Coordinates pulled from rts_gtfs.sqlite stops table on 2026-04-30 to match
  # the canonical GTFS stop. `stop_id` is the authoritative anchor — when present,
  # find_trips() pegs directly to that stop (zero walking, exact match) instead of
  # nearest-stops from lat/lon. lat/lon stay as a fallback for other consumers.
  coordinates:
    "Rosa Parks RTS Downtown Station":
      stop_id: "1"
      lat: 29.645567
      lon: -82.322697
      aliases: ["rosa parks", "downtown station", "rts downtown"]
    "Butler Plaza Transfer Station":
      stop_id: "1493"
      lat: 29.625154
      lon: -82.38789
      aliases: ["butler plaza", "butler transfer"]
    "Reitz Union":
      stop_id: "473"
      lat: 29.64514
      lon: -82.346983
      aliases: ["uf reitz union", "reitz", "student union"]
    "Oaks Mall":
      stop_id: "1097"
      lat: 29.659514
      lon: -82.413875
      aliases: ["the oaks mall", "oaks"]
    "Santa Fe College":
      stop_id: "521"
      lat: 29.67778
      lon: -82.430533
      aliases: ["santa fe", "sf college", "sfc"]
    "Shands Hospital":
      stop_id: "16"
      lat: 29.640205
      lon: -82.34626
      aliases: ["shands", "uf health", "uf shands"]

branding:
  primary_color: "#0057B8"
  background_color: "#070d1a"
  app_name: "RTS Bus Tracker"

# Agency-custom destination disambiguation catalog.
# Landmarks are seeded from the local GTFS feed via scripts/extract_landmarks_from_gtfs.py.
# POIs are manually curated addresses for common destination types that may not map
# cleanly to a single GTFS stop. Each new agency supplies its own landmarks + POIs.
common_destinations:
  # Populated from the GTFS extractor — paste landmark entries here.
  landmarks: {}
  pois:
    "health department":
      - name: "Alachua County Health Department"
